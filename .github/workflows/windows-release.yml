name: Test and Publish Windows Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-release.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-release.txt
      - name: Compile Python source
        run: python -m compileall -q dynamic_teleprompter launcher.py tools
      - name: Regression tests
        working-directory: dynamic_teleprompter
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Real Qt and FFmpeg export smoke test
        working-directory: dynamic_teleprompter
        run: python desktop_entry.py --smoke-test --smoke-report ../smoke-source.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-smoke-result
          path: smoke-source.json

  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-release.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-release.txt
      - name: Build optional native engine
        shell: pwsh
        run: |
          cmake -S dynamic_teleprompter/native -B build/native
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build build/native --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
          $dll = Get-ChildItem build/native -Recurse -Filter dt_engine.dll | Select-Object -First 1
          if (-not $dll) { throw 'Native engine DLL missing' }
          Copy-Item -LiteralPath $dll.FullName -Destination dynamic_teleprompter/native/dt_engine.dll -Force
      - name: Build and verify portable executable
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Cosmere-Cam-Windows-release
          path: dist/*
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'dynamic_teleprompter'); from release_info import VERSION; print(VERSION)"
          $tag = "v$version"
          $existing = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'This version is already published. Bump VERSION before another release.' }
          gh release create $tag dist/*.zip dist/SHA256SUMS.txt dist/frozen-smoke.json dist/frozen-alignment.json --target $env:GITHUB_SHA --title "Cosmere Cam $tag" --notes-file docs/RELEASE-alpha17.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed' }
